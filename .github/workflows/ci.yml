name: CI

on:
  pull_request:
  push:
    branches: [main, development]
  workflow_dispatch:

# komp is built with a released kflat toolchain, the one compiler/kf.toml's
# `kflat` pin names; the compiler itself is komp-co/kf-lang's.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
      - name: Build komp and run kf-tool's tests
        run: CHECK_CLI=0 sh scripts/check.sh

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
      - name: Build komp and run the command-line checks
        run: CHECK_TESTS=0 sh scripts/check.sh
